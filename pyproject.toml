[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opsguard"
version = "0.1.0"
description = "Secure agentic SRE copilot for Kubernetes/OpenShift — multi-LLM, RAG, MCP, guardrails and red teaming"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hreshvik Sewraj" }]
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
openai = ["openai>=1.40"]
gemini = ["google-genai>=1.0"]
mcp = ["mcp>=1.2"]
tokens = ["tiktoken>=0.7"]
all = ["openai>=1.40", "google-genai>=1.0", "mcp>=1.2", "tiktoken>=0.7"]
dev = ["pytest>=8", "ruff>=0.5", "mcp>=1.2"]

[project.scripts]
opsguard = "opsguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
